# ============================================================================
# SecureBiz Lab - CI pipeline (GitHub Actions)
# ============================================================================
#
# Runs on every push and pull request on main.
#
# Scope:
#   - Compile Python sources (app, scripts, tests).
#   - Run the 108 host tests with -W error::DeprecationWarning.
#
# The 24 container tests (test_isolation*.py, test_refresh_db.py) are NOT
# run here: they require Docker Compose, Vault, PostgreSQL, and Docker
# internal DNS (db:5432, vault:8200). They are executed manually or in a
# separate job (future work).
#
# No secrets are required for the host tests: tests/conftest.py sets
# dummy values for DB_*, AUTH_DB_*, VAULT_TOKEN, VAULT_ADDR. The tests
# mock get_jwt_secret and get_auth_connection.
#
# SAST (bandit) and dependency scanning (pip-audit) are handled by a
# separate workflow (Phase 7, task 3).
# ============================================================================

name: SecureBiz Lab CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python-3-12:
    name: Host tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q app scripts tests

      - name: Run host tests
        run: |
          python -m pytest \
            tests/test_dependencies_lifecycle.py \
            tests/test_jwt.py \
            tests/test_refresh.py \
            tests/test_auth_routes.py \
            tests/test_provision_user.py \
            -W error::DeprecationWarning \
            -v

  test-python-3-13:
    name: Host tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q app scripts tests

      - name: Run host tests
        run: |
          python -m pytest \
            tests/test_dependencies_lifecycle.py \
            tests/test_jwt.py \
            tests/test_refresh.py \
            tests/test_auth_routes.py \
            tests/test_provision_user.py \
            -W error::DeprecationWarning \
            -v